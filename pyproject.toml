[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vecmemori"
version = "0.1.0"
description = "Hybrid memory engine: SQLite + FTS5 + HRR algebra + neural embeddings for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["memory", "ai-agent", "embeddings", "hrr", "sqlite", "vector-symbolic"]
authors = [
    {name = "iwaan"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
hermes = [
    "vecmemori[embed]",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]
all = [
    "vecmemori[embed]",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/iwaan/vecmemori"
Repository = "https://github.com/iwaan/vecmemori"
Documentation = "https://github.com/iwaan/vecmemori#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vecmemori*"]
