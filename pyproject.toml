[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vecmemori"
version = "0.1.0"
description = "Hybrid memory engine: SQLite + FTS5 + neural embeddings for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
keywords = ["memory", "ai-agent", "embeddings", "sqlite", "fts5", "sentence-transformers"]
authors = [
    {name = "iwaan"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
# Kept for backwards-compatible install commands; embeddings are core now.
embed = []
ja = [
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.0",
]
hermes = [
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]
all = [
    "vecmemori[ja]",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "check-manifest>=0.49",
]

[project.urls]
Homepage = "https://github.com/iwaan10000vr/vecmemori"
Repository = "https://github.com/iwaan10000vr/vecmemori"
Documentation = "https://github.com/iwaan10000vr/vecmemori#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vecmemori*"]

[tool.setuptools.package-data]
"vecmemori.hermes" = ["plugin.yaml"]
